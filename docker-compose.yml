name: docker-firmaec-5

services:
  postgres:
    image: postgres:15-alpine
    container_name: firmaec-postgres
    restart: unless-stopped
    command: ["postgres", "-c", "listen_addresses=*"]
    environment:
      POSTGRES_DB:       ${FIRMAEC_DB:-firmaec}
      POSTGRES_USER:     ${FIRMAEC_DB_USER:-firmaec_app}
      POSTGRES_PASSWORD: ${FIRMAEC_DB_PASSWORD:?FIRMAEC_DB_PASSWORD requerido en .env}
      TZ:   ${TZ:-America/Guayaquil}
      PGTZ: ${TZ:-America/Guayaquil}
    ports:
      - "${FIRMAEC_DB_HOST_PORT:-5436}:5432"
    volumes:
      - firmaec-pgdata:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${FIRMAEC_DB_USER:-firmaec_app} -d ${FIRMAEC_DB:-firmaec}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [firmaec-net]

  wildfly:
    build:
      context: .
      dockerfile: wildfly/Dockerfile.runtime
    image: docker-firmaec-5/wildfly:${FIRMAEC_VERSION:-5.1}
    container_name: firmaec-wildfly
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST:  postgres
      DB_PORT:  "5432"
      DB_NAME:  ${FIRMAEC_DB:-firmaec}
      DB_USER:  ${FIRMAEC_DB_USER:-firmaec_app}
      DB_PASS:  ${FIRMAEC_DB_PASSWORD:?FIRMAEC_DB_PASSWORD requerido}
      JAVA_OPTS: "-Xms${JBOSS_XMS:-256m} -Xmx${JBOSS_XMX:-2048m} -XX:MetaspaceSize=96M -XX:MaxMetaspaceSize=512m -Djava.net.preferIPv4Stack=true"
      TZ: ${TZ:-America/Guayaquil}
    # Puerto HTTP (8080) NO expuesto al host: el acceso pasa por nginx.
    # Mantener management (9990) opcional para depuración directa.
    expose:
      - "8080"
    ports:
      - "${FIRMAEC_MGMT_HOST_PORT:-9990}:9990"
    mem_limit: ${JBOSS_MEM_LIMIT:-4096m}
    # Healthcheck: comprueba que WildFly responde en HTTP. La raíz devuelve 404
    # (sin app), pero el server está vivo. -sS sin -f no falla por código 4xx.
    healthcheck:
      test: ["CMD-SHELL", "curl -sS -o /dev/null http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    networks: [firmaec-net]

  cliente-prueba:
    build:
      context: ./cliente-prueba
    image: docker-firmaec-5/cliente-prueba:${FIRMAEC_VERSION:-5.1}
    container_name: firmaec-cliente
    restart: unless-stopped
    depends_on:
      - wildfly
    environment:
      FIRMAEC_API_BASE:      http://wildfly:8080/api
      FIRMAEC_SERVICIO_BASE: http://wildfly:8080/servicio
      FIRMAEC_PUBLIC_BASE:   ${FIRMAEC_PUBLIC_BASE:-http://localhost:${NGINX_HOST_PORT:-8080}}
      FIRMAEC_SISTEMA:       ${FIRMAEC_CLIENT_SISTEMA:-ClienteDemo}
      FIRMAEC_API_KEY:       ${FIRMAEC_CLIENT_API_KEY:-}
      FIRMAEC_DB_HOST:       postgres
      FIRMAEC_DB_NAME:       ${FIRMAEC_DB:-firmaec}
      FIRMAEC_DB_USER:       ${FIRMAEC_DB_USER:-firmaec_app}
      FIRMAEC_DB_PASS:       ${FIRMAEC_DB_PASSWORD:?FIRMAEC_DB_PASSWORD requerido}
    # Puerto del cliente NO expuesto al host: el acceso pasa por nginx.
    expose:
      - "80"
    networks: [firmaec-net]

  nginx:
    image: nginx:1.27-alpine
    container_name: firmaec-nginx
    restart: unless-stopped
    depends_on:
      - wildfly
      - cliente-prueba
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${NGINX_HOST_PORT:-8080}:80"
    healthcheck:
      # 127.0.0.1 explícito: nginx escucha IPv4 only; `localhost` resuelve a ::1 primero.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [firmaec-net]

volumes:
  firmaec-pgdata:

networks:
  firmaec-net:
    driver: bridge
