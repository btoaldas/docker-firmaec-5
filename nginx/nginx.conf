worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile          on;
    tcp_nopush        on;
    tcp_nodelay       on;
    keepalive_timeout 65;
    server_tokens     off;

    # Tamaño máx upload — PDFs + cert .p12 grandes pueden superar el default 1M.
    client_max_body_size 100M;

    # Logs a stdout/stderr para `docker compose logs nginx`.
    access_log /dev/stdout;
    error_log  /dev/stderr;

    # Upstreams — Docker DNS resuelve los nombres a IPs internas.
    upstream wildfly_upstream {
        server wildfly:8080;
        keepalive 32;
    }

    upstream cliente_upstream {
        server cliente-prueba:80;
        keepalive 16;
    }

    server {
        listen 80 default_server;
        server_name _;

        # Healthcheck del propio nginx
        location = /healthz {
            access_log off;
            return 200 'ok\n';
            add_header Content-Type text/plain;
        }

        # FirmaEC API REST (api.war desplegado en WildFly)
        # Rutas: /api/fecha-hora, /api/certificado/revocado/{serial}, /api/appfirmardocumento, etc.
        location /api/ {
            proxy_pass http://wildfly_upstream/api/;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";

            proxy_connect_timeout 60s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;
        }

        # FirmaEC Servicio REST (servicio.war desplegado en WildFly)
        # Rutas: /servicio/getjwt, /servicio/appfirmardocumento, /servicio/documentos, etc.
        location /servicio/ {
            proxy_pass http://wildfly_upstream/servicio/;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";

            proxy_connect_timeout 60s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;
        }

        # Cliente PHP de prueba (raíz)
        location / {
            proxy_pass http://cliente_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";
        }
    }
}
